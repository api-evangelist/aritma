name: Aritma

image: https://cdn.prod.website-files.com/6373dc3023ac2e946464f5b3/65805757fee228b9b87f2434_6572e8614112a5e3b5553b67_Open%20banking1.svg

description: Aritma provides a finance automation platform for B2B enterprises, enabling seamless payments, reconciliation, and integration with
  multiple ERP systems. Their API connects banks, ERP solutions like Microsoft Dynamics 365, Business NXT, Visma, and more, allowing developers
  to build custom workflows for CFOs, accountants, and IT teams. The platform supports multi‑bank transactions, ISO‑20022 compliance, and offers
  extensive documentation for developers to integrate financial data across systems.

